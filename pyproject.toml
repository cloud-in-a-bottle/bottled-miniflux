# Test-only Python project: runs the unit tests and the app under the Cloud in a Bottle test harness.
[project]
name = "miniflux-tests"
version = "0.0.0"
requires-python = "==3.12.*"

[dependency-groups]
dev = [
    "openhost[test-harness] @ git+https://github.com/cloud-in-a-bottle/cloud-in-a-bottle@main",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The unit tests import the app's top-level modules (auth_proxy, auto_subscribe).
pythonpath = ["."]
